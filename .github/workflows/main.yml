name: Deploy CodeIgniter 4 to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean workspace (remove Git and non-prod files)
        run: |
          rm -rf .git
          rm -rf .github
          rm -f .gitignore
          rm -f README.md
          rm -f Dockerfile
          rm -rf docker
          rm -f docker-compose.yml
          rm -f scratch_db.php
          rm -f db_check.txt

      - name: 🚀 Incremental SFTP Deploy to Cafe24
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          localDir: '.'
          remoteDir: ${{ secrets.SFTP_REMOTE_PATH }}
          exclude: 'vendor,vendor/**,writable,writable/**,public/uploads,public/uploads/**,public/data,public/data/**'