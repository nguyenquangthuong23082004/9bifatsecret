name: Deploy CodeIgniter 4 to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Incremental Deploy to Cafe24
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: ftps
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            Dockerfile
            docker/**
            docker-compose.yml
            scratch_db.php
            db_check.txt