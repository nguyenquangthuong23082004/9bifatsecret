name: Deploy CodeIgniter 4 to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Incremental SFTP Deploy to Cafe24
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          localDir: '.'
          remoteDir: ${{ secrets.SFTP_REMOTE_PATH }}
          exclude: '.git, .git/**, .github, .github/**, README.md, Dockerfile, docker, docker/**, docker-compose.yml, scratch_db.php, db_check.txt, vendor, vendor/**, writable, writable/**, public/uploads, public/uploads/**, public/data, public/data/**'