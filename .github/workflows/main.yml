- name: SFTP Deploy to Cafe24
  uses: appleboy/scp-action@v0.1.7
  with:
    host: ${{ secrets.SFTP_HOST }}
    username: ${{ secrets.SFTP_USER }}
    password: ${{ secrets.SFTP_PASS }}
    port: ${{ secrets.SFTP_PORT }}
    source: "./*"
    target: ${{ secrets.SFTP_REMOTE_PATH }}
    rm: false
    strip_components: 0
    exclude: |
      .git
      .git/**
      .github
      .github/**
      .gitignore
      README.md